# ─────────────────────────────────────────────────────────────────────────────
# HTTPS для локального стенда.
#
#   ./infra/tls/make-local-cert.sh
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# Открывается на https://local.westauto.com.ua:8443
# Нужен, чтобы проверить установку PWA и secure-куки: браузеры разрешают
# то и другое только по https (localhost — единственное исключение).
# ─────────────────────────────────────────────────────────────────────────────

services:
  web:
    ports:
      - '${HTTP_PORT}:80'
      - '${HTTPS_PORT:-8443}:443'
    volumes:
      - ./infra/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/dev-tls.conf:/etc/nginx/conf.d/tls.conf:ro
      - ./infra/tls:/etc/nginx/tls:ro
