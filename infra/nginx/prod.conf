# ─────────────────────────────────────────────────────────────────────────────
# Боевой режим: nginx отдаёт собранную статику и проксирует API.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;

    # Сжатие: страница и бандлы жмутся втрое
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # Приложение внутреннее — поисковикам там делать нечего
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── API ────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }


    # Карта сайта и robots собираются из БД: список авто меняется ежедневно
    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        proxy_pass http://api:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        expires 7d;
    }

    # /app без косой черты — самый частый способ набрать адрес руками.
    # Без этого правила он уходит в location / (на сайт), который такого
    # маршрута не знает, и человек получает 404 на ровном месте.
    # Относительные редиректы: иначе nginx подставляет собственный порт 80,
    # и за прокси на другом порту адрес в Location получается нерабочим.
    absolute_redirect off;

    location = /app {
        return 301 /app/;
    }

    # ─── Внутреннее приложение (SPA) ────────────────────────────────────────
    location /app/ {
        try_files $uri $uri/ /app/index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Хешированные ассеты неизменяемы — кешируем навсегда
    location ~* ^/(app/)?assets/.*\.(js|css|woff2?|png|jpe?g|webp|avif|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Публичный сайт ─────────────────────────────────────────────────────
    #
    # Отдаётся сервером отрисовки, а не статикой: карточки витрины должны
    # приезжать поисковику готовой разметкой, а список авто меняется ежедневно.
    location / {
        proxy_pass http://site:4173;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
