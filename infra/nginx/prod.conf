# ─────────────────────────────────────────────────────────────────────────────
# Боевой режим: два сайта и одна CRM за общим входом.
#
#   westauto.com.ua                 → WestAuto
#   <агент>.westauto.com.ua         → тот же WestAuto с карточкой агента
#   autokey.seoshkin.tools          → АвтоКлюч (и всё, что не совпало)
#   /app  и  /api                   → общие для всех доменов
#
# Страницы витрины собираются на запрос (SSR), а не пререндером: список авто
# меняется ежедневно, поисковик должен видеть готовую разметку.
# ─────────────────────────────────────────────────────────────────────────────

# Встроенный DNS Docker: без него nginx резолвит имена контейнеров один раз
# при старте и после перезапуска сервисов отдаёт 502 при живых контейнерах.
resolver 127.0.0.11 valid=10s ipv6=off;

# ─── Общие куски обоих сайтов ────────────────────────────────────────────────

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── WestAuto и сайты агентов ────────────────────────────────────────────────

server {
    listen 80;
    # Основной домен — westauto.com.ua. Адреса на seoshkin.tools сюда уже не
    # доходят: роутер экосистемы отдаёт по ним 301 на com.ua. Имена оставлены
    # на случай запроса в обход роутера (локальная проверка по 127.0.0.1:8088).
    server_name westauto.com.ua www.westauto.com.ua
                ~^.+\.westauto\.com\.ua$
                westauto.seoshkin.tools ~^.+\.westauto\.seoshkin\.tools$;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    set $api      http://api:3000;
    set $westauto http://westauto:4174;

    location /api/ {
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Карта сайта и robots собираются из БД: список авто меняется ежедневно
    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        proxy_pass $api$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass $api$request_uri;
        proxy_set_header Host $host;
        expires 7d;
    }

    # /app без косой черты — самый частый способ набрать адрес руками
    location = /app { return 301 /app/; }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Ассеты внутреннего приложения — статика из образа
    location ^~ /app/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Ассеты сайта лежат не здесь, а в сервере отрисовки: это его сборка.
    # Отдавать их из статики nginx нечем — получается 404 и страница без
    # стилей при живом сайте.
    location ^~ /assets/ {
        proxy_pass $westauto$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Имена файлов содержат хеш содержимого — можно кешировать навсегда
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass $westauto$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# ─── АвтоКлюч ────────────────────────────────────────────────────────────────
#
# default_server: сюда попадает всё, что не совпало с именами выше.

server {
    listen 80 default_server;
    server_name autokey.seoshkin.tools _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    set $api     http://api:3000;
    set $autokey http://site:4173;

    location /api/ {
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        proxy_pass $api$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass $api$request_uri;
        proxy_set_header Host $host;
        expires 7d;
    }

    location = /app { return 301 /app/; }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Ассеты внутреннего приложения — статика из образа
    location ^~ /app/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Ассеты сайта лежат не здесь, а в сервере отрисовки: это его сборка.
    # Отдавать их из статики nginx нечем — получается 404 и страница без
    # стилей при живом сайте.
    location ^~ /assets/ {
        proxy_pass $autokey$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Имена файлов содержат хеш содержимого — можно кешировать навсегда
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass $autokey$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
