# ─────────────────────────────────────────────────────────────────────────────
# Боевые домены — источник истины для серверного роутера.
#
# Каталог infra/nginx/router монтируется в ecosystem_router как
# /etc/nginx/conf.d/westauto (см. /home/seosite/infra/router/docker-compose.yml
# на сервере). Роутер терминирует HTTPS и отдаёт запрос контейнеру
# westauto_web, а тот уже разводит домены и маршруты внутри проекта
# (infra/nginx/prod.conf).
#
# Раскладка доменов:
#   westauto.com.ua           основной адрес сайта и CRM (/app)
#   www.westauto.com.ua       301 на адрес без www
#   <агент>.westauto.com.ua   сайт агента
#   autokey.seoshkin.tools    АвтоКлюч, свой сайт, не трогаем
#   westauto.seoshkin.tools   301 на westauto.com.ua (прежний адрес)
#
# ВАЖНО про первый выпуск сертификата на новом домене: пока файла сертификата
# нет, HTTPS-блока в конфиге быть не должно. nginx не стартует со ссылкой на
# несуществующий файл и уронит ВСЕ сайты роутера. Порядок такой:
# только HTTP-блок → certbot webroot → добавить HTTPS-блок → nginx -s reload.
#
# ШАГ 1 из 2: сертификата на westauto.com.ua ещё нет, поэтому здесь только
# HTTP-блок нового домена. HTTPS-блок появится следующим коммитом, после
# выпуска сертификата.
# ─────────────────────────────────────────────────────────────────────────────

# ─── westauto.com.ua ─────────────────────────────────────────────────────────

server {
    listen 80;
    server_name westauto.com.ua www.westauto.com.ua ~^.+\.westauto\.com\.ua$;

    # ACME-челленджи Let's Encrypt (общий webroot экосистемы).
    # Имя домена должно совпасть именно с этим блоком: default_server в
    # роутере не объявлен, и без своего server_name запрос уйдёт в первый
    # попавшийся блок чужого проекта, где этой location нет.
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; allow all; }

    location / { return 301 https://$host$request_uri; }
}

# ─── seoshkin.tools: прежние адреса ──────────────────────────────────────────

server {
    listen 80;
    server_name westauto.seoshkin.tools autokey.seoshkin.tools
                ~^.+\.westauto\.seoshkin\.tools$;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; allow all; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name westauto.seoshkin.tools autokey.seoshkin.tools
                ~^.+\.westauto\.seoshkin\.tools$;

    # Сертификат на три имени seoshkin.tools.
    ssl_certificate     /etc/letsencrypt/live/westauto.seoshkin.tools/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/westauto.seoshkin.tools/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; allow all; }

    # Фотографии авто в витрину грузятся из CRM
    client_max_body_size 12m;

    location / {
        proxy_pass         http://westauto_web:80;
        proxy_http_version 1.1;
        # Домен доезжает до проекта как есть: по нему внутренний nginx
        # различает WestAuto, АвтоКлюч и поддомен агента
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        # Без этого заголовка кука сессии не помечается Secure и вход в CRM
        # выглядит как «залогинился и вылетел»
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
