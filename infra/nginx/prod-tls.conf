# ─────────────────────────────────────────────────────────────────────────────
# Боевой TLS. Кладётся вместо prod.conf, когда сертификат уже получен.
#
# Получение сертификата на Debian-инстансе GCP:
#
#   sudo apt install certbot
#   sudo certbot certonly --standalone -d westauto.com.ua -d www.westauto.com.ua
#
# Пути certbot по умолчанию: /etc/letsencrypt/live/<домен>/
# Их нужно примонтировать в контейнер web:
#   volumes:
#     - /etc/letsencrypt:/etc/letsencrypt:ro
#
# Продление — cron от certbot; после продления достаточно
#   docker compose exec web nginx -s reload
# ─────────────────────────────────────────────────────────────────────────────

# Весь http уводим на https. Исключение — проверка домена certbot'ом,
# иначе продление сертификата перестанет работать.
server {
    listen 80;
    server_name westauto.com.ua www.westauto.com.ua;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name westauto.com.ua www.westauto.com.ua;

    ssl_certificate     /etc/letsencrypt/live/westauto.com.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/westauto.com.ua/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # HSTS включаем только после того, как убедились, что https работает:
    # откатить его у уже побывавших на сайте браузеров нельзя.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        proxy_pass http://api:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        expires 7d;
    }

    # /app без косой черты — самый частый способ набрать адрес руками.
    # Без этого правила он уходит в location / (на сайт), который такого
    # маршрута не знает, и человек получает 404 на ровном месте.
    # Относительные редиректы: иначе nginx подставляет собственный порт 80,
    # и за прокси на другом порту адрес в Location получается нерабочим.
    absolute_redirect off;

    location = /app {
        return 301 /app/;
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ~* ^/(app/)?assets/.*\.(js|css|woff2?|png|jpe?g|webp|avif|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
