# ─────────────────────────────────────────────────────────────────────────────
# Виртуальный хост для nginx НА ХОСТЕ (не в контейнере).
#
# На машине 80-й порт занят системным nginx — там уже живут другие проекты.
# Поэтому наш стенд слушает 8081, а это проксирующий вход, чтобы сайты
# открывались по адресу без порта.
#
# Установка (спросит пароль вашей учётной записи):
#
#   sudo cp infra/nginx/host-vhost.conf \
#     /etc/nginx/sites-enabled/westauto-local.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Записи в /etc/hosts дебиана не нужны: запрос приходит из Windows, где
# они уже прописаны, а nginx разбирает его по заголовку Host.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;

    # Оба сайта и любой поддомен агента
    server_name local.westauto.seoshkin.tools
                local.autokey.seoshkin.tools
                ~^.+\.westauto\.seoshkin\.tools$;

    client_max_body_size 12m;

    # Относительные редиректы: иначе nginx подставит собственный порт
    absolute_redirect off;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        # Host передаём как есть — по нему контейнерный nginx выбирает,
        # какой из двух сайтов показать
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vite держит горячую перезагрузку на вебсокете
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400s;
    }
}
