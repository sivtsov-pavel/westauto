# ─────────────────────────────────────────────────────────────────────────────
# Виртуальный хост для nginx НА ХОСТЕ (не в контейнере).
#
# На машине уже занят 80-й порт системным nginx, поэтому стенд слушает 8081,
# а это — проксирующий вход, чтобы проект открывался по адресу
# http://local.westauto.com.ua без указания порта.
#
# Установка:
#   sudo cp infra/nginx/host-vhost.conf /etc/nginx/sites-enabled/local.westauto.com.ua.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   echo '127.0.0.1 local.westauto.com.ua' | sudo tee -a /etc/hosts
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name local.westauto.com.ua;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vite держит HMR на вебсокете — без этого горячая перезагрузка молчит
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400s;
    }
}
