# ─────────────────────────────────────────────────────────────────────────────
# Режим разработки: два сайта и одна CRM за общим входом.
#
#   local.autokey.seoshkin.tools    → АвтоКлюч
#   local.westauto.seoshkin.tools   → WestAuto
#   <агент>.westauto.seoshkin.tools → тот же WestAuto с карточкой агента
#   /app  и  /api                   → общие для всех доменов
# ─────────────────────────────────────────────────────────────────────────────

# Встроенный DNS Docker.
#
# Без него nginx резолвит имена контейнеров ОДИН раз при старте и держит
# адрес вечно. После перезапуска адреса меняются, и стенд отвечает 502 при
# живых сервисах. Поэтому адреса храним в переменных: proxy_pass с
# переменной перечитывает DNS по указанному сроку годности.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── WestAuto и сайты агентов ────────────────────────────────────────────────

server {
    listen 80;
    server_name local.westauto.seoshkin.tools westauto.seoshkin.tools
                westauto.localhost local.westauto.com.ua
                ~^.+\.westauto\.seoshkin\.tools$;

    client_max_body_size 12m;
    absolute_redirect off;

    set $api      http://api:3000;
    set $westauto http://westauto:5175;
    set $appsrv   http://app:5174;

    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        proxy_pass $api$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass $api$request_uri;
        proxy_set_header Host $host;
    }

    location = /app { return 301 /app/; }

    location /app/ {
        proxy_pass $appsrv$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass $westauto$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
    }
}

# ─── АвтоКлюч ────────────────────────────────────────────────────────────────
#
# default_server: сюда попадает всё, что не совпало с именами выше —
# localhost, IP машины и любой другой адрес.

server {
    listen 80 default_server;
    server_name local.autokey.seoshkin.tools autokey.seoshkin.tools
                autokey.localhost localhost _;

    client_max_body_size 12m;
    absolute_redirect off;

    set $api     http://api:3000;
    set $autokey http://site:5173;
    set $appsrv  http://app:5174;

    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        proxy_pass $api$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass $api$request_uri;
        proxy_set_header Host $host;
    }

    location = /app { return 301 /app/; }

    location /app/ {
        proxy_pass $appsrv$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass $autokey$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
    }
}
