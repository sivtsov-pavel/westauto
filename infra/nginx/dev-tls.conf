# ─────────────────────────────────────────────────────────────────────────────
# TLS для локального стенда. Подключается docker-compose.tls.yml.
# Сертификат самоподписанный, создаётся скриптом infra/tls/make-local-cert.sh
# ─────────────────────────────────────────────────────────────────────────────

upstream avk_api_tls  { server api:3000; }
upstream avk_site_tls { server site:5173; }
upstream avk_app_tls  { server app:5174; }

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/local.crt;
    ssl_certificate_key /etc/nginx/tls/local.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 12m;

    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        proxy_pass http://avk_api_tls;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://avk_api_tls;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://avk_api_tls;
        proxy_set_header Host $host;
    }

    # /app без косой черты — самый частый способ набрать адрес руками.
    # Без этого правила он уходит в location / (на сайт), который такого
    # маршрута не знает, и человек получает 404 на ровном месте.
    # Относительные редиректы: иначе nginx подставляет собственный порт 80,
    # и за прокси на другом порту адрес в Location получается нерабочим.
    absolute_redirect off;

    location = /app {
        return 301 /app/;
    }

    location /app/ {
        proxy_pass http://avk_app_tls;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass http://avk_site_tls;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}
