# ─────────────────────────────────────────────────────────────────────────────
# TLS для локального стенда: те же два сайта, что и по http.
#
# Нужен, чтобы проверить установку приложения и secure-куки — по обычному
# http браузер не даёт ни того, ни другого.
#
# Сертификат: ./infra/tls/make-local-cert.sh
# Запуск:     docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

# resolver объявлен в dev.conf — оба файла грузятся в один блок http,
# и повторное объявление роняет nginx целиком

map $http_upgrade $connection_upgrade_tls {
    default upgrade;
    ''      close;
}

# ─── WestAuto и сайты агентов ────────────────────────────────────────────────

server {
    listen 443 ssl;
    http2 on;
    server_name local.westauto.seoshkin.tools westauto.seoshkin.tools
                ~^.+\.westauto\.seoshkin\.tools$;

    ssl_certificate     /etc/nginx/tls/local.crt;
    ssl_certificate_key /etc/nginx/tls/local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 12m;
    absolute_redirect off;

    set $api      http://api:3000;
    set $westauto http://westauto:5175;
    set $appsrv   http://app:5174;

    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        proxy_pass $api$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ { proxy_pass $api$request_uri; proxy_set_header Host $host; }

    location = /app { return 301 /app/; }

    location /app/ {
        proxy_pass $appsrv$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade_tls;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass $westauto$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade_tls;
        proxy_read_timeout 86400s;
    }
}

# ─── АвтоКлюч ────────────────────────────────────────────────────────────────

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/local.crt;
    ssl_certificate_key /etc/nginx/tls/local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 12m;
    absolute_redirect off;

    set $api     http://api:3000;
    set $autokey http://site:5173;
    set $appsrv  http://app:5174;

    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        proxy_pass $api$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ { proxy_pass $api$request_uri; proxy_set_header Host $host; }

    location = /app { return 301 /app/; }

    location /app/ {
        proxy_pass $appsrv$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade_tls;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass $autokey$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade_tls;
        proxy_read_timeout 86400s;
    }
}
